# $Revision$ : $Date$

MCR.NameOfProject=Catalogus_Universitatis_Gottingensis
MCR.Metadata.Languages=de
MCR.LanguageClassification=rfc5646
MCR.SWF.Project.ID=cug

#----------------------------------------------------------------------
# Solr Configuration
#----------------------------------------------------------------------
MCR.Solr.DynamicFields=false
MCR.Solr.ServerURL=http://localhost:8983/
MCR.Solr.Core.main.Name=cug_main
MCR.Solr.Core.main.ServerURL=%MCR.Solr.ServerURL%
MCR.Solr.Core.classification.Name=cug_class
MCR.Solr.Core.classification.ServerURL=%MCR.Solr.ServerURL%

#----------------------------------------------------------------------
# active site menu path
#----------------------------------------------------------------------
MCR.Webpage.Navigation.main.ueber_uns=main.ueber_uns

#----------------------------------------------------------------------
# Editor / Searchmask Configuration: Select boxes
#----------------------------------------------------------------------
OMD.profkat.adminfunction=dekan,direktor,kommissar,kurator,mitdirektor,praesident,prodekan,prorektor,rektor,syndicus,unirichter,uniprediger,vizepraesident,zweituniprediger
OMD.profkat.internalinfo=admin,editor


#----------------------------------------------------------------------
# User Configuration
#----------------------------------------------------------------------
MCR.Servlet.MCRShibbolethLoginServlet.Disabled=false
MCR.user2.Shibboleth.PersistUser=true

#----------------------------------------------------------------------
# Editor
#----------------------------------------------------------------------
MCR.Workflow.Metadata.Editor.Path.create_object_simple.wf_edit_profkat=/editor/metadata/cug-editor-metadata.xed

#----------------------------------------------------------------------
# Matrikel
#----------------------------------------------------------------------
MCR.Metadata.Type.matrikel=true
MCR.Metadata.Config.matrikel=datamodel-matrikel.xml

# Override manager to support default matrikel xml
MCR.Workflow.WorkflowMgr.Class.create_object_simple.wf_edit_profkat=de.gbv.profkat.bpmn.workflows.create_object_simple.CUGWorkflowMgr

# Override mode to support person and matrikel objects
MCR.Workflow.RetrieveMode.wf_edit_profkat=/mycoreobject[contains(@ID,'_person_') or contains(@ID,'_matrikel_')]

# Override view to customize
MCR.JSPDocportal.Doctails.View=/cug-docdetails

# Override solr-document to handle person and matrikel
MCR.URIResolver.xslImports.solr-document=solr/indexing/solr-basetemplate.xsl
MCR.URIResolver.xslImports.solr-document=%MCR.URIResolver.xslImports.solr-document%,solr/indexing/mycoreobject-dynamicfields.xsl
MCR.URIResolver.xslImports.solr-document=%MCR.URIResolver.xslImports.solr-document%,solr/indexing/person-solr.xsl,solr/indexing/cug-matrikel.xsl

# Configure matrikel index browser
MCR.IndexBrowser.matname.Searchfield=cug.matrikel.name.plain
MCR.IndexBrowser.matname.Facetfield=cug.matrikel.name.facet
MCR.IndexBrowser.matname.FilterQuery=

# Configure search result for index and search results without thumbnail
MCR.SearchResult.matrikel.Headerfield=cug.matrikel.name.full
MCR.SearchResult.matrikel.Datafields=cug.matrikel.enrollment_sequence_number,cug.matrikel.semester,cug.matrikel.field_of_study

#----------------------------------------------------------------------
# Misc
#----------------------------------------------------------------------
MCR.JSPDocportal.ErrorServlet.View=error
